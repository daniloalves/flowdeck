# Builds the Linux packages and the macOS disk images for a version tag (v*) and publishes them
# as a GitHub release, with the notes of that version from CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            packages/app/release/*.deb
            packages/app/release/*.AppImage
          if-no-files-found: error

  macos:
    # Native modules (node-pty, better-sqlite3) are built per architecture, so one runner each.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flowdeck/mcp build && pnpm --filter @flowdeck/app dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: packages/app/release/*.dmg
          if-no-files-found: error

  release:
    needs: [linux, macos]
    # Publish what was built even if one macOS architecture failed.
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## ${version}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "FlowDeck ${version}" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "FlowDeck ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
          fi
