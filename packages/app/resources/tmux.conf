# Generated for FlowDeck's dedicated tmux socket (`tmux -L flowdeck`).
# It never affects your personal tmux server.

# The canvas is the UI: no status bar and no prefix key.
# Ctrl+B is left to the program running in the node (Claude Code uses it for background tasks).
set -g status off
set -g prefix None
unbind-key C-b

# Keep dead panes so FlowDeck can show a "resume" button.
set -g remain-on-exit on
set -g history-limit 50000

# Mouse wheel scrolls the scrollback; selection is handled by tmux copy mode.
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
# Indexed (not appended) so re-applying this file to a running server stays idempotent.
# hyperlinks: OSC 8 links from programs reach FlowDeck, which opens web links on Ctrl+click.
set -s terminal-features[10] "xterm-256color:RGB:clipboard:hyperlinks"

# Mouse selections are copied to FlowDeck through OSC 52 (FlowDeck puts them in the system
# clipboard and the PRIMARY selection). "external": programs inside a node cannot set it.
set -s set-clipboard external

# Scrollback: FlowDeck draws its own scrollbar, so tmux's yellow position indicator is hidden (-H)
# and selections use the canvas' selection colours.
set -g mode-style "bg=#3d3d66,fg=#e6e6ef"
# vi copy-mode keys: a mouse selection then includes the character under the pointer where the
# drag ends (with emacs keys the end is exclusive, so the last character was never copied).
# Keys never reach copy mode: typing leaves it first.
set -g mode-keys vi
bind-key -T root WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -eH }
bind-key -T root MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -MH }

# One client per session: the window follows the node's size.
set -g window-size latest
setw -g aggressive-resize on

# Never let programs inside a node talk to the outer terminal or rename things.
set -g allow-passthrough off
set -g allow-rename off
set -g set-titles off
setw -g automatic-rename off
